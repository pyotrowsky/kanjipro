name: Validate pull requests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Rebuild database from Anki exports
        run: python scripts/rebuild_database.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Validate PWA icons
        run: python scripts/install_shiba_pwa_icons.py /tmp/kanjipro-icons-test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript module syntax
        run: |
          for file in js/*.js; do node --check "$file"; done

      - name: Run regression tests
        run: npm test
