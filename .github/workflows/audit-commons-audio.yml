name: One-time Wikimedia audio coverage audit

on:
  push:
    branches:
      - audit-commons-audio-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit Commons and Lingua Libre audio
        run: python scripts/audit_commons_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commons-audio-audit
          path: audio-coverage-audit.json
          if-no-files-found: ignore
