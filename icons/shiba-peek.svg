<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 338" role="img" aria-label="Shiba Inu wygląda zza karty i trzyma się jej łapkami">
<title>Shiba Inu wygląda zza karty i trzyma się jej łapkami</title>
<defs>
<linearGradient id="fur" x1=".12" y1=".08" x2=".85" y2="1"><stop offset="0%" stop-color="#ffd890"/><stop offset="43%" stop-color="#f9ab50"/><stop offset="100%" stop-color="#ea8431"/></linearGradient>
<linearGradient id="body" x1=".15" y1=".12" x2=".85" y2="1"><stop offset="0%" stop-color="#ffcd79"/><stop offset="100%" stop-color="#e98830"/></linearGradient>
<linearGradient id="muzzle" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0%" stop-color="#fffbef"/><stop offset="100%" stop-color="#fff1d9"/></linearGradient>
